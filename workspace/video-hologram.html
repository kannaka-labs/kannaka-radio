<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const isEmbedded = (window.parent !== window);
// Prominent version marker — if you don't see this, you're running cached JS.
console.log('%c[hologram] version 2026-04-14 mixamo-aware, rest-relative, dm-v2', 'background:#1a0f30;color:#ff66aa;padding:4px 8px;font-weight:bold;');

// -- State --
let trackTitle = '', trackAlbum = '', trackFile = '';
let consciousness = { phi: 0, xi: 0, order: 0, level: 'dormant' };
let perception = { rms_energy: 0.3, valence: 0.5, tempo_bpm: 90, spectral_centroid: 2000 };
let titleShowTime = 0, titleVisible = false, audioStarted = false, currentAudioFile = '';

const LEVELS = { dormant: 0, stirring: 1, aware: 2, coherent: 3, resonant: 4 };
function levelVal() { return LEVELS[consciousness.level] || 0; }
function levelFactor() { return (levelVal() + 1) / 5; }

// -- Audio --
const audioEl = document.getElementById('audio');
audioEl.volume = 0.8;

if (isEmbedded) {
  document.getElementById('play-gate').style.display = 'none';
  document.getElementById('vol-ctrl').style.display = 'none';
  document.getElementById('overlay').style.display = 'none';
  window.addEventListener('message', (e) => {
    if (!e.data) return;
    if (e.data.type === 'perception') perception = e.data.data;
    else if (e.data.type === 'state' && e.data.data?.current) {
      trackTitle = e.data.data.current.title || '';
      trackAlbum = e.data.data.current.album || '';
    } else if (e.data.type === 'consciousness') {
      Object.assign(consciousness, { phi: e.data.data.phi||0, xi: e.data.data.xi||0, order: e.data.data.order||0, level: e.data.data.level||'dormant' });
    }
  });
}

window.startAudio = function() {
  if (isEmbedded) return;
  const gate = document.getElementById('play-gate');
  gate.classList.add('hidden');
  setTimeout(() => gate.style.display = 'none', 1000);
  audioStarted = true;
  const vc = document.getElementById('vol-ctrl');
  vc.classList.add('show');
  setTimeout(() => vc.classList.remove('show'), 3000);
  if (currentAudioFile) loadAndPlay(currentAudioFile);
};

function loadAndPlay(file) {
  if (isEmbedded || !audioStarted || !file) return;
  const src = '/audio/' + encodeURIComponent(file);
  if (audioEl.src.endsWith(encodeURIComponent(file))) { audioEl.play().catch(() => {}); return; }
  currentAudioFile = file;
  audioEl.src = src;
  audioEl.play().catch(() => {});
}
window.setVolume = (val) => { audioEl.volume = val / 100; };
audioEl.addEventListener('ended', () => fetch('/api/next', { method: 'POST' }).catch(() => {}));

// ── Audio analyser for lip sync ──────────────────────
let audioCtx = null, analyser = null, freqData = null, audioSourceConnected = false;

function initAudioAnalyser() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.7;
    freqData = new Uint8Array(analyser.frequencyBinCount);
  } catch(e) { console.warn('[hologram] Audio analyser failed:', e); }
}

function connectAudioSource() {
  if (audioSourceConnected || !audioCtx || !analyser) return;
  try {
    const source = audioCtx.createMediaElementSource(audioEl);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    audioSourceConnected = true;
    console.log('[hologram] Audio analyser connected — lip sync active');
  } catch(e) { console.warn('[hologram] Audio source connect failed:', e); }
}

// Detailed audio analysis — bass, mids, highs, vocal, beat
const audio = { bass: 0, mid: 0, high: 0, vocal: 0, overall: 0, beat: false, beatHold: 0, prevBass: 0 };

function analyzeAudio(dt) {
  if (!analyser || !freqData) return audio;
  analyser.getByteFrequencyData(freqData);
  // Bass: bins 1-4 (~40-300Hz) — kick drums, bass
  let bass = 0; for (let i = 1; i < 5; i++) bass += freqData[i]; bass /= (4 * 255);
  // Mids: bins 5-15 (~300-1.5kHz) — instruments, body
  let mid = 0; for (let i = 5; i < 16; i++) mid += freqData[i]; mid /= (11 * 255);
  // Highs: bins 16-40 (~1.5-6kHz) — cymbals, sibilance
  let high = 0; for (let i = 16; i < 41; i++) high += freqData[i]; high /= (25 * 255);
  // Vocal: bins 4-20 (~300-3kHz)
  let vocal = 0; for (let i = 4; i < 20; i++) vocal += freqData[i]; vocal /= (16 * 255);
  // Overall
  let overall = 0; for (let i = 0; i < freqData.length; i++) overall += freqData[i]; overall /= (freqData.length * 255);
  // Beat detection: bass spike
  audio.beatHold = Math.max(0, audio.beatHold - dt);
  audio.beat = (bass > audio.prevBass + 0.08 && bass > 0.2 && audio.beatHold <= 0);
  if (audio.beat) audio.beatHold = 0.15; // 150ms hold
  audio.prevBass = bass;
  // Smooth
  const r = 0.3;
  audio.bass += (bass - audio.bass) * r;
  audio.mid += (mid - audio.mid) * r;
  audio.high += (high - audio.high) * r;
  audio.vocal += (vocal - audio.vocal) * r;
  audio.overall += (overall - audio.overall) * r;
  return audio;
}

function getVocalAmplitude() { return audio.vocal; }

// Connect analyser when audio first plays
audioEl.addEventListener('play', () => { initAudioAnalyser(); connectAudioSource(); });

// -- Three.js --
const isMobile = /Mobi|Android/i.test(navigator.userAgent);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 1.5, 5);
const renderer = new THREE.WebGLRenderer({ antialias: !isMobile, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.5 : 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.prepend(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.9, 0.4, 0.45);
const useBloom = !isMobile;
if (useBloom) composer.addPass(bloomPass);

// -- Lighting --
const ambientLight = new THREE.AmbientLight(0x220033, 0.4);
scene.add(ambientLight);
const backLight = new THREE.PointLight(0x8899ff, 70, 30);
backLight.position.set(0, 3.0, -3.0); // higher and further for dramatic silhouette edge
scene.add(backLight);
const spotLight = new THREE.SpotLight(0xffeedd, 15, 15, Math.PI / 6, 0.5);
spotLight.position.set(3, 4, 2);
spotLight.target.position.set(0, 1.5, 0);
scene.add(spotLight, spotLight.target);
// Front fill — warm light to show skin detail
const fillLight = new THREE.PointLight(0xffddcc, 4, 10);
fillLight.position.set(-1, 2.5, 4);
scene.add(fillLight);
// Rim light — cool blue behind and above for silhouette edge
const rimLight = new THREE.PointLight(0x4488cc, 30, 15);
rimLight.position.set(0, 3.5, -3.5);
scene.add(rimLight);
// Face light — warm, low intensity, always illuminates her features
const faceLight = new THREE.PointLight(0xffeedd, 3, 6);
faceLight.position.set(0, 2.2, 2.5);
scene.add(faceLight);

// -- Starfield --
const starCount = isMobile ? 200 : 600;
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  starPos[i*3] = (Math.random()-0.5)*80;
  starPos[i*3+1] = (Math.random()-0.5)*80;
  starPos[i*3+2] = -20 - Math.random()*60;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x6644aa, size: 0.08, transparent: true, opacity: 0.5 })));

// -- Orbiting Particles --
const particleCount = isMobile ? 300 : 750;
const particleGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(particleCount * 3);
const pPhases = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount; i++) {
  const orbitR = 0.8 + Math.random()*2.5, angle = Math.random()*Math.PI*2;
  pPos[i*3] = Math.cos(angle)*orbitR;
  pPos[i*3+1] = (Math.random()-0.3)*4;
  pPos[i*3+2] = Math.sin(angle)*orbitR;
  pPhases[i*3] = orbitR;
  pPhases[i*3+1] = 0.2 + Math.random()*0.8;
  pPhases[i*3+2] = Math.random()*Math.PI*2;
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const particleMat = new THREE.PointsMaterial({
  color: 0x8866dd, size: isMobile ? 0.03 : 0.022,
  transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false,
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// ── Floating album artwork cards ─────────────────────
const artCards = [];
const artGroup = new THREE.Group();
scene.add(artGroup);

// ── GhostSignals: minimal LMSR prediction market ──────────────
// Port of https://github.com/NickFlach/ghostsignals-rs — Robin Hanson's
// Logarithmic Market Scoring Rule. Every tick the market's cost function
// C(q) = b · ln(Σ exp(qᵢ/b)) is updated and prices p(i) = exp(qᵢ/b) / Σ
// sum to 1.0. Log-sum-exp trick keeps it numerically stable.
class LMSRMarket {
  constructor(outcomes, b) {
    this.outcomes = outcomes;
    this.b = b; // liquidity — higher = less price sensitivity per trade
    this.q = new Array(outcomes.length).fill(0);
    this.tradeCount = 0;
    this.volume = 0;
  }
  _cost() {
    const qMax = Math.max(...this.q) / this.b;
    let s = 0;
    for (const qi of this.q) s += Math.exp(qi / this.b - qMax);
    return this.b * (qMax + Math.log(s));
  }
  prices() {
    const qMax = Math.max(...this.q) / this.b;
    const exps = this.q.map(qi => Math.exp(qi / this.b - qMax));
    const sum = exps.reduce((a, b) => a + b, 0);
    return exps.map(e => e / sum);
  }
  trade(outcomeIdx, shares) {
    const before = this._cost();
    this.q[outcomeIdx] += shares;
    const cost = this._cost() - before;
    this.tradeCount++;
    this.volume += Math.abs(shares);
    return cost;
  }
  entropy() {
    const p = this.prices();
    return -p.reduce((acc, pi) => acc + (pi > 0 ? pi * Math.log2(pi) : 0), 0);
  }
}

// ── GhostSignals Hub: multi-market prediction about Kannaka/music ────
// Port of https://github.com/NickFlach/ghostsignals-rs (LMSR) +
// https://github.com/NickFlach/ghostsignals-bridge (market-driven K).
//
// Multiple simultaneous markets — themed to the music and to Kannaka —
// plus a user-submitted prediction channel. Each trader holds beliefs
// across all markets and trades on edges. Markets auto-resolve from
// music perception / stage state, then new ones are spawned.
//
// The Kuramoto coupling K is the AVERAGE P(Yes) across all active
// markets — a shared "confidence index" that drives swarm sync.
const GSHub = {
  K_BASE: 2.5,
  B_LIQUIDITY: 8,
  traders: [],
  markets: new Map(),
  _nextId: 1,
  _tradesTotal: 0,
  _resolvedLog: [],
  _lastShotType: null, // updated from the camera system
  K: 0,
  r: 0,

  // ── Market lifecycle ─────────────────────────────────────
  createMarket(question, opts = {}) {
    const id = 'm' + (this._nextId++);
    const market = new LMSRMarket(['Yes', 'No'], opts.liquidity || this.B_LIQUIDITY);
    market.trade(0, (Math.random() - 0.5) * 0.6); // small random seed
    const m = {
      id,
      question,
      market,
      createdAt: (performance.now() / 1000),
      ttl: opts.ttl || 60,
      tag: opts.tag || 'custom',
      userCreated: !!opts.userCreated,
      resolver: opts.resolver || null, // (audio, hub) → 0|1|null
      resolved: false,
      winner: null,
      resolvedAt: null,
    };
    this.markets.set(id, m);
    console.log('[gshub] market created:', id, question);
    // Give traders initial beliefs on this market
    for (const tr of this.traders) {
      tr.beliefs[id] = 0.25 + Math.random() * 0.5;
      tr.portfolio[id] = [0, 0];
    }
    return id;
  },

  initTraders(count) {
    this.traders = [];
    for (let i = 0; i < count; i++) {
      this.traders.push({
        idx: i,
        phase: Math.random() * Math.PI * 2,
        omega: 0.4 + Math.random() * 0.8,
        beliefs: {},
        portfolio: {},
        capital: 100,
        lastTradeAt: -10 - Math.random() * 5,
        lastFlash: 0,
        flashColor: '#ffffff',
      });
    }
  },

  // Seed the hub with auto-resolving markets about music + Kannaka state
  seedDefaultMarkets() {
    const now = performance.now() / 1000;
    this.createMarket('Vocal peak > 0.7 in next 60s', { tag: 'music', ttl: 60,
      resolver: (audio) => (audio && audio.vocal > 0.7) ? 0 : null });
    this.createMarket('Bass hit > 0.6 in next 45s', { tag: 'music', ttl: 45,
      resolver: (audio) => (audio && audio.bass > 0.6) ? 0 : null });
    this.createMarket('Tempo climbs above 120 BPM this track', { tag: 'music', ttl: 90,
      resolver: (audio) => (audio && audio.tempo > 120) ? 0 : null });
    this.createMarket('Swarm reaches coherence r > 0.85', { tag: 'swarm', ttl: 40,
      resolver: (audio, hub) => hub.r > 0.85 ? 0 : null });
    this.createMarket('Kannaka hits a REACH gesture in next 30s', { tag: 'dance', ttl: 30,
      resolver: () => (window._lastGestureType === 'REACH') ? 0 : null });
    this.createMarket('Next close-up is a "face" shot', { tag: 'camera', ttl: 20,
      resolver: (audio, hub) => {
        if (hub._lastShotType === 'face') return 0;
        if (hub._lastShotType && hub._lastShotType !== 'face' && hub._lastShotType !== null) return 1;
        return null;
      }});
    this.createMarket('Wide stage shot fires in next 25s', { tag: 'camera', ttl: 25,
      resolver: (audio, hub) => hub._lastShotType === 'wide_stage' ? 0 : null });
    this.createMarket('A commercial plays in next 90s', { tag: 'radio', ttl: 90,
      resolver: () => window._lastTrackCommercial ? 0 : null });
  },

  computeOrderParameter() {
    const N = this.traders.length;
    if (N === 0) return 0;
    let sx = 0, sy = 0;
    for (const t of this.traders) { sx += Math.cos(t.phase); sy += Math.sin(t.phase); }
    return Math.sqrt(sx * sx + sy * sy) / N;
  },

  step(dt, t, audio) {
    const N = this.traders.length;
    if (N === 0) return;

    // 1. Resolve any markets whose resolver fired or whose TTL expired
    for (const m of this.markets.values()) {
      if (m.resolved) continue;
      if (m.resolver) {
        const result = m.resolver(audio, this);
        if (result === 0 || result === 1) {
          m.resolved = true;
          m.winner = result;
          m.resolvedAt = t;
          this._resolvedLog.push({ id: m.id, q: m.question, winner: m.winner, t });
          if (this._resolvedLog.length > 20) this._resolvedLog.shift();
          console.log('[gshub] resolved', m.id, m.question, '→', m.winner === 0 ? 'Yes' : 'No');
          // Flash winning traders
          const winIdx = m.winner;
          for (const tr of this.traders) {
            const p = tr.portfolio[m.id];
            if (p && p[winIdx] > 0.5) {
              tr.lastFlash = 1.2;
              tr.flashColor = winIdx === 0 ? '#76ff03' : '#ff6b6b';
              tr.capital += p[winIdx] * 0.8;
            }
          }
        }
      }
      if (!m.resolved && t - m.createdAt > m.ttl) {
        // TTL expired without being resolved → winner is current majority
        const p = m.market.prices();
        m.resolved = true;
        m.winner = p[0] > p[1] ? 0 : 1;
        m.resolvedAt = t;
        this._resolvedLog.push({ id: m.id, q: m.question, winner: m.winner, t, ttlResolved: true });
      }
      // ── ORC resonance push: any resolved market tagged 'orc-resonance'
      // with a stored stem id pushes its final Yes price back to the
      // stem-server via the radio's /api/orc/resonance proxy.
      if (m.resolved && m.tag === 'orc-resonance' && m.orcStemId && !m._resonancePosted) {
        m._resonancePosted = true;
        const finalPrice = m.market.prices()[0];
        this.postResonance(m.orcStemId, finalPrice, m.id);
      }
    }

    // 2. Garbage-collect very old resolved markets (keep last 3 for log)
    const active = [...this.markets.values()].filter(m => !m.resolved);
    const resolved = [...this.markets.values()].filter(m => m.resolved).sort((a,b) => b.resolvedAt - a.resolvedAt);
    for (const old of resolved.slice(3)) {
      this.markets.delete(old.id);
      for (const tr of this.traders) {
        delete tr.beliefs[old.id];
        delete tr.portfolio[old.id];
      }
    }

    // 3. Auto-respawn the default market set if we're running low
    if (active.length < 4) {
      // Pick a random default and create a fresh instance
      const templates = [
        () => this.createMarket('Vocal peak > 0.7 in next 60s', { tag: 'music', ttl: 60, resolver: (a) => (a && a.vocal > 0.7) ? 0 : null }),
        () => this.createMarket('Bass hit > 0.6 in next 45s', { tag: 'music', ttl: 45, resolver: (a) => (a && a.bass > 0.6) ? 0 : null }),
        () => this.createMarket('Swarm reaches r > 0.85 in next 40s', { tag: 'swarm', ttl: 40, resolver: (a, h) => h.r > 0.85 ? 0 : null }),
        () => this.createMarket('REACH gesture in next 30s', { tag: 'dance', ttl: 30, resolver: () => (window._lastGestureType === 'REACH') ? 0 : null }),
        () => this.createMarket('Wide stage shot in next 25s', { tag: 'camera', ttl: 25, resolver: (a, h) => h._lastShotType === 'wide_stage' ? 0 : null }),
        () => this.createMarket('Commercial plays in next 90s', { tag: 'radio', ttl: 90, resolver: () => window._lastTrackCommercial ? 0 : null }),
        () => this.createMarket('Tempo > 120 BPM this track', { tag: 'music', ttl: 90, resolver: (a) => (a && a.tempo > 120) ? 0 : null }),
        () => this.createMarket('High note in next 45s (vocal > 0.55)', { tag: 'music', ttl: 45, resolver: (a) => (a && a.vocal > 0.55) ? 0 : null }),
      ];
      templates[Math.floor(Math.random() * templates.length)]();
    }

    // 4. Kuramoto phase update — K = K_BASE × average P(Yes) across markets
    let coupling = 0, count = 0;
    for (const m of this.markets.values()) {
      if (m.resolved) continue;
      coupling += m.market.prices()[0];
      count++;
    }
    coupling = count > 0 ? coupling / count : 0.5;
    this.K = this.K_BASE * Math.max(0.1, Math.min(1.5, coupling * 1.3));

    let mx = 0, my = 0;
    for (const tr of this.traders) { mx += Math.cos(tr.phase); my += Math.sin(tr.phase); }
    mx /= N; my /= N;
    for (const tr of this.traders) {
      const c = this.K * (my * Math.cos(tr.phase) - mx * Math.sin(tr.phase));
      tr.phase += (tr.omega + c) * dt;
      if (tr.phase > Math.PI * 2) tr.phase -= Math.PI * 2;
      if (tr.phase < 0) tr.phase += Math.PI * 2;
      tr.lastFlash = Math.max(0, tr.lastFlash - dt * 2.5);
    }
    this.r = this.computeOrderParameter();

    // 5. Trading — ~5% of traders per tick place one trade on a random market
    if (active.length === 0) return;
    const budget = Math.max(1, Math.floor(N * 0.05));
    for (let k = 0; k < budget; k++) {
      const tr = this.traders[Math.floor(Math.random() * N)];
      if (t - tr.lastTradeAt < 0.35) continue;
      const m = active[Math.floor(Math.random() * active.length)];
      let belief = tr.beliefs[m.id];
      if (belief === undefined) belief = 0.3 + Math.random() * 0.4;
      // Drift beliefs toward current market price + small noise + hints
      belief = belief * 0.9 + m.market.prices()[0] * 0.05 + (Math.random() - 0.5) * 0.05;
      belief = Math.max(0.02, Math.min(0.98, belief));
      tr.beliefs[m.id] = belief;
      const edge = belief - m.market.prices()[0];
      if (Math.abs(edge) < 0.03) continue;
      const outcomeIdx = edge > 0 ? 0 : 1;
      const size = Math.min(6, Math.abs(edge) * 20 + Math.random() * 1.5);
      m.market.trade(outcomeIdx, size);
      if (!tr.portfolio[m.id]) tr.portfolio[m.id] = [0, 0];
      tr.portfolio[m.id][outcomeIdx] += size;
      tr.lastTradeAt = t;
      tr.lastFlash = 1;
      tr.flashColor = outcomeIdx === 0 ? '#a29bfe' : '#ff9f43';
      this._tradesTotal++;
    }
  },

  // Public API used by the HUD/UI
  getActiveMarkets() {
    return [...this.markets.values()].filter(m => !m.resolved)
      .sort((a, b) => (b.market.volume || 0) - (a.market.volume || 0));
  },
  getRecentResolutions() { return this._resolvedLog.slice(-5).reverse(); },
  getState() {
    return {
      r: this.r,
      K: this.K,
      trades: this._tradesTotal,
      activeCount: this.getActiveMarkets().length,
      resolvedCount: this._resolvedLog.length,
    };
  },

  // ── ORC integration: per-track resonance market ─────────
  // When a new track starts, seed a TRACK_ALBUM_INCLUSION market on
  // "Will this track be canonical for [phase]?" with a TTL matching the
  // track duration. When the market resolves, POST the final Yes price
  // as the track's resonance score back to the ORC stem-server.
  async seedTrackResonanceMarket(trackTitle, phase) {
    if (!trackTitle) return;
    // Look up the ORC stem id for this track
    try {
      const r = await fetch('/api/orc/lookup?track=' + encodeURIComponent(trackTitle));
      const d = await r.json();
      const stem = d.stem;
      if (!stem) return; // not in the ORC stem library
      const q = 'Is "' + trackTitle + '" canonical for phase ' + (stem.phase || phase || '?') + '?';
      const id = this.createMarket(q, {
        tag: 'orc-resonance',
        ttl: 180,
        userCreated: false,
      });
      const m = this.markets.get(id);
      if (m) {
        m.orcStemId = stem.id;
        m.trackTitle = trackTitle;
      }
    } catch (e) { /* silent — not every track is in ORC */ }
  },

  // Called from the resolver loop — POST to radio proxy for stem-server persist
  postResonance(stemId, score, marketId) {
    try {
      fetch('/api/orc/resonance/' + encodeURIComponent(stemId), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          score,
          source: 'hologram-gshub',
          confidence: Math.min(1, (this._tradesTotal || 0) / 100),
          market_id: marketId,
        }),
      }).then(r => r.json()).then(d => console.log('[orc] resonance POST', d)).catch(() => {});
    } catch (_) {}
  },

  // Place a user trade (100-credit buy of Yes or No)
  userBuy(marketId, outcomeIdx, shares = 10) {
    const m = this.markets.get(marketId);
    if (!m || m.resolved) return null;
    const cost = m.market.trade(outcomeIdx, shares);
    // Spread the user trade as a small spike so the crowd reacts visibly
    for (const tr of this.traders.slice(0, 8)) {
      tr.beliefs[m.id] = Math.min(0.98, Math.max(0.02, (tr.beliefs[m.id] || 0.5) + (outcomeIdx === 0 ? 0.08 : -0.08)));
      tr.lastFlash = 1.2;
      tr.flashColor = outcomeIdx === 0 ? '#76ff03' : '#ff6b6b';
    }
    return { cost, prices: m.market.prices() };
  },
};

function gsEsc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hashStr(s) { let h=0; for(let i=0;i<s.length;i++) h=((h<<5)-h+s.charCodeAt(i))|0; return Math.abs(h); }

function generateAlbumTexture(name) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  const h = hashStr(name);

  // Background gradient
  const hue1 = h % 360, hue2 = (h * 7) % 360;
  const g = ctx.createLinearGradient(0, 0, 256, 256);
  g.addColorStop(0, `hsl(${hue1},60%,15%)`);
  g.addColorStop(1, `hsl(${hue2},50%,20%)`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 256);

  // Generative pattern
  const pattern = h % 5;
  ctx.globalAlpha = 0.3;
  for (let i = 0; i < 12; i++) {
    const x = ((h * (i+3) * 17) % 256);
    const y = ((h * (i+7) * 13) % 256);
    const r = 10 + ((h * (i+1)) % 40);
    ctx.strokeStyle = `hsl(${(hue1 + i*30)%360},70%,50%)`;
    ctx.lineWidth = 1.5;
    if (pattern === 0) { ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke(); }
    else if (pattern === 1) { ctx.strokeRect(x-r,y-r,r*2,r*2); }
    else if (pattern === 2) { ctx.beginPath(); ctx.moveTo(x,y-r); ctx.lineTo(x+r,y+r); ctx.lineTo(x-r,y+r); ctx.closePath(); ctx.stroke(); }
    else if (pattern === 3) { for(let j=0;j<4;j++) { ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(j*1.57)*r,y+Math.sin(j*1.57)*r); ctx.stroke(); } }
    else { ctx.beginPath(); ctx.arc(x,y,r*0.3,0,Math.PI*2); ctx.fillStyle=`hsl(${(hue2+i*25)%360},60%,40%)`; ctx.fill(); }
  }

  // Album title
  ctx.globalAlpha = 0.8;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px Courier New';
  ctx.textAlign = 'center';
  // Word wrap
  const words = name.split(' ');
  let lines = [], line = '';
  for (const w of words) {
    if ((line + w).length > 18) { lines.push(line.trim()); line = ''; }
    line += w + ' ';
  }
  lines.push(line.trim());
  const startY = 256 - 20 - lines.length * 20;
  lines.forEach((l, i) => ctx.fillText(l, 128, startY + i * 20));

  return new THREE.CanvasTexture(c);
}

function cycleOneCard() {
  if (allArtwork.length <= ART_VISIBLE) return;
  // Pick the oldest card to replace
  const oldCard = artCards.shift();
  if (oldCard) { artGroup.remove(oldCard); oldCard.geometry?.dispose(); oldCard.material?.dispose(); }
  // Pick next artwork (cycle through all)
  artCycleIndex = (artCycleIndex + 1) % allArtwork.length;
  // Skip if already showing
  const showing = new Set(artCards.map(c => c.userData.name));
  let idx = artCycleIndex;
  for (let tries = 0; tries < allArtwork.length; tries++) {
    if (!showing.has(allArtwork[idx].title)) break;
    idx = (idx + 1) % allArtwork.length;
  }
  makeCard(allArtwork[idx], Math.floor(Math.random() * ART_VISIBLE), ART_VISIBLE);
}

  lPupil.position.set(-eyeX, eyeY, eyeZ + 0.032);
  const lCatch = new THREE.Mesh(catchGeo, catchMat);

  // Eyelids — thin arcs above each eye
  const lidGeo = new THREE.TorusGeometry(0.035, 0.006, 6, 16, Math.PI);
  const lidMat = skinMat.clone();

  noseBridge.position.set(0, eyeY - 0.025, eyeZ + 0.015);

  rBrow.position.set(eyeX, browY, eyeZ + 0.005);

// -- VRM Model --
let vrm = null, headBone = null;
const headY = 2.05;
const bones = {};
const BONE_NAMES = ['hips','spine','chest','upperChest','neck','head','leftShoulder','rightShoulder','leftUpperArm','rightUpperArm','leftLowerArm','rightLowerArm','leftHand','rightHand','leftUpperLeg','rightUpperLeg','leftLowerLeg','rightLowerLeg','leftFoot','rightFoot'];

async function loadVRM() {
  const loader = new GLTFLoader();
  let model;
  try {
    loader.register((parser) => new VRMLoaderPlugin(parser));
    const gltf = await loader.loadAsync('/models/kannaka.vrm');
    vrm = gltf.userData.vrm;
    if (vrm) {
      // three-vrm 3.x: combineSkeletons replaces the deprecated removeUnnecessaryJoints.
      if (VRMUtils.combineSkeletons) VRMUtils.combineSkeletons(vrm.scene);
      else if (VRMUtils.removeUnnecessaryJoints) VRMUtils.removeUnnecessaryJoints(vrm.scene);
      model = vrm.scene;
      console.log('[hologram] VRM loaded via plugin');
    } else {
      model = gltf.scene;
      console.log('[hologram] VRM plugin returned null, using GLTF scene');
    }
  } catch(e) {
    console.warn('[hologram] VRM plugin failed, loading as plain GLTF:', e.message);
    const loader2 = new GLTFLoader();
    const gltf = await loader2.loadAsync('/models/kannaka.vrm');
    model = gltf.scene;
  }
  // Scale to ~4 units tall
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const scale = 4 / size.y;
  model.scale.setScalar(scale);
  // The user reported she was facing backwards with knees bending "wrong".
  // This VRM's authored forward is -Z (toward the camera) already, so the
  // 180° rotation was making her face +Z (away from camera). Remove it.
  // If a future model is VRM-1.0 (forward=+Z), set this to Math.PI.
  model.rotation.y = 0;
  model.position.set(-center.x*scale, -box.min.y*scale - 0.5, center.z*scale);
  // Remove head geometry by collapsing vertices above neck height
  // Model space: total height ~2.63, neck at ~2.05
  // Head bone is scaled to 0.001 after bone setup — hides VRM head + triangle
  // Just apply materials here
  model.traverse((child) => {
    if (child.isMesh) {
      child.material = skinMat.clone();
      child.castShadow = false;
      child.receiveShadow = false;
      // Add wireframe sibling that shares geometry and follows skeleton
      const wire = new THREE.Mesh(child.geometry, wireMat.clone());
      wire.morphTargetInfluences = child.morphTargetInfluences;
      wire.morphTargetDictionary = child.morphTargetDictionary;
      if (child.isSkinnedMesh) {
        const wSkinned = new THREE.SkinnedMesh(child.geometry, wireMat.clone());
        wSkinned.skeleton = child.skeleton;
        wSkinned.bindMatrix.copy(child.bindMatrix);
        wSkinned.bindMatrixInverse.copy(child.bindMatrixInverse);
        child.parent.add(wSkinned);
      } else {
        child.parent.add(wire);
      }
    }
  });
  scene.add(model);
  // ── Primary bone acquisition: the SkinnedMesh skeleton itself ──
  // Bypass the humanoid abstraction entirely — walk the SkinnedMesh.skeleton and
  // find bones by name. These are the EXACT bones the renderer uses for skinning,
  // so setting their rotation is guaranteed to deform the mesh.
  //
  // Pick the SkinnedMesh with the MOST bones — typically the body mesh. A VRM
  // model may have multiple SkinnedMeshes (body, face, hair, outfit). Grabbing
  // the first one sometimes returns a face mesh with a tiny skeleton that lacks
  // arms/legs entirely.
  let primarySkinnedMesh = null;
  model.traverse(o => {
    if (o.isSkinnedMesh && o.skeleton) {
      if (!primarySkinnedMesh || o.skeleton.bones.length > primarySkinnedMesh.skeleton.bones.length) {
        primarySkinnedMesh = o;
      }
    }
  });
  if (primarySkinnedMesh) console.log('[hologram] Primary SkinnedMesh:', primarySkinnedMesh.name || '(unnamed)', 'with', primarySkinnedMesh.skeleton.bones.length, 'bones');
  if (primarySkinnedMesh && primarySkinnedMesh.skeleton) {
    const skelBones = primarySkinnedMesh.skeleton.bones;
    console.log('[hologram] Skeleton has', skelBones.length, 'bones');
    // Regex patterns — matched against the LOWERCASED bone name. Patterns are
    // anchored or use word-boundary-like tricks so "leftarm" doesn't grab
    // "leftforearm", and "leftleg" doesn't grab "leftupleg".
    const patterns = {
      hips:          [/(^|[^a-z])hips?$/, /(^|[^a-z])pelvis$/],
      spine:         [/(^|[^a-z])spine1?$/],
      chest:         [/(^|[^a-z])spine2$/, /(^|[^a-z])chest$/, /upperbody$/],
      upperChest:    [/(^|[^a-z])spine3$/, /upperchest$/],
      neck:          [/(^|[^a-z])neck$/],
      head:          [/(^|[^a-z])head$/],
      leftShoulder:  [/leftshoulder$/, /lshoulder$/, /l_shoulder$/],
      rightShoulder: [/rightshoulder$/, /rshoulder$/, /r_shoulder$/],
      // Upper arm: ends in "arm" but NOT "forearm" — Mixamo uses LeftArm/LeftForeArm
      leftUpperArm:  [/(?<!fore)leftarm$/, /leftupperarm$/, /l_upperarm$/, /(?<!fore)larm$/],
      rightUpperArm: [/(?<!fore)rightarm$/, /rightupperarm$/, /r_upperarm$/, /(?<!fore)rarm$/],
      leftLowerArm:  [/leftforearm$/, /leftlowerarm$/, /l_forearm$/, /lforearm$/],
      rightLowerArm: [/rightforearm$/, /rightlowerarm$/, /r_forearm$/, /rforearm$/],
      leftHand:      [/lefthand$/, /l_hand$/, /lhand$/],
      rightHand:     [/righthand$/, /r_hand$/, /rhand$/],
      // Upper leg: "LeftUpLeg" or "LeftUpperLeg" or "LeftThigh"
      leftUpperLeg:  [/leftupleg$/, /leftupperleg$/, /leftthigh$/, /l_upleg$/],
      rightUpperLeg: [/rightupleg$/, /rightupperleg$/, /rightthigh$/, /r_upleg$/],
      // Lower leg: "LeftLeg" but NOT "LeftUpLeg" — negative lookbehind on "up"
      leftLowerLeg:  [/(?<!up)leftleg$/, /leftlowerleg$/, /leftshin$/, /leftcalf$/],
      rightLowerLeg: [/(?<!up)rightleg$/, /rightlowerleg$/, /rightshin$/, /rightcalf$/],
      leftFoot:      [/leftfoot$/, /l_foot$/, /lfoot$/],
      rightFoot:     [/rightfoot$/, /r_foot$/, /rfoot$/],
    };
    for (const logical of BONE_NAMES) {
      const pats = patterns[logical] || [new RegExp(logical.toLowerCase() + '$')];
      let found = null;
      for (const p of pats) {
        found = skelBones.find(b => p.test(b.name.toLowerCase()));
        if (found) break;
      }
      if (found) bones[logical] = found;
    }
    console.log('[hologram] Skeleton bones matched via patterns:', Object.keys(bones).filter(k=>bones[k]).length, '/', BONE_NAMES.length);
  }
  // Secondary: fill from VRM humanoid for any bones still missing
  if (vrm && vrm.humanoid) {
    // CRITICAL: disable humanoid auto-sync so our direct bone writes persist across
    // vrm.update() calls. Without this, humanoid.update() copies normalized→raw
    // every frame and wipes out our dance rotations.
    if ('autoUpdateHumanBones' in vrm.humanoid) {
      vrm.humanoid.autoUpdateHumanBones = false;
      console.log('[hologram] Disabled humanoid.autoUpdateHumanBones');
    } else {
      // Older API: try to null out the update method
      try {
        const orig = vrm.humanoid.update?.bind(vrm.humanoid);
        vrm.humanoid.update = () => {};
        console.log('[hologram] Stubbed humanoid.update()');
      } catch(e) { console.warn('[hologram] Could not stub humanoid.update:', e.message); }
    }
    for (const name of BONE_NAMES) {
      if (!bones[name]) {
        const node = vrm.humanoid.getRawBoneNode(name);
        if (node) bones[name] = node;
      }
    }
  }
  if (false) { /* legacy fallback block below, disabled */
    // Fallback: search the model's skeleton by common VRM/mixamo bone names
    const boneAliases = {
      hips: ['hips','hip','pelvis','root'],
      spine: ['spine','spine1'],
      chest: ['chest','spine2','upper_body'],
      upperChest: ['upperchest','spine3'],
      neck: ['neck'],
      head: ['head'],
      leftUpperArm: ['leftupperarm','leftshoulder','left_arm','l_arm','j_bac_l'],
      rightUpperArm: ['rightupperarm','rightshoulder','right_arm','r_arm','j_bac_r'],
      leftLowerArm: ['leftlowerarm','leftforearm','left_forearm','l_forearm'],
      rightLowerArm: ['rightlowerarm','rightforearm','right_forearm','r_forearm'],
      leftHand: ['lefthand','left_hand','l_hand'],
      rightHand: ['righthand','right_hand','r_hand'],
      leftUpperLeg: ['leftupperleg','leftleg','left_leg','l_leg','j_asi_l'],

// ── Dance Memory — she learns to dance by remembering what worked ──
const DanceMemory = (() => {
  const MAX = 500, KEY = 'kannaka_dance_memory_v3'; // v3 — pose deltas from rest
  // Purge older versions
  try { localStorage.removeItem('kannaka_dance_memory'); } catch(e) {}
  try { localStorage.removeItem('kannaka_dance_memory_v2'); } catch(e) {}
  const BK = ['hipsY','hipsX','hipsZ','spineY','spineX','spineZ','chestY','chestX','chestZ','headY','headX','headZ','lArmZ','lArmX','lArmY','rArmZ','rArmX','rArmY','lElbow','rElbow','lLegX','lLegZ','rLegX','rLegZ','lKnee','rKnee'];
  let snaps = [], dirty = 0, last = null, lastT = 0, lastLoggedSim = -1;
  try { const raw = localStorage.getItem(KEY); if (raw) { snaps = JSON.parse(raw) || []; console.log('[dance-memory] Loaded', snaps.length, 'snapshots (v3/deltas)'); } } catch(e) { console.warn('[dance-memory] localStorage unavailable:', e.message); }
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(snaps)); } catch(e) {} };

  // Music feature "richness" — magnitude of the audio portion. If this is tiny,
  // audio is effectively silent and the snapshot has no learning value.
  const richness = (f) => {
    const m2 = f.bass*f.bass + f.mid*f.mid + f.high*f.high + f.vocal*f.vocal + f.energy*f.energy;
    return Math.sqrt(m2 / 5); // 0..1-ish
  };

  // Cosine similarity over the audio-only portion (tempo excluded from magnitude
  // so a default tempo doesn't dominate). Returns 0 when either vector is silent.
  const sim = (a, b) => {
    const av = [a.bass, a.mid, a.high, a.vocal, a.energy];
    const bv = [b.bass, b.mid, b.high, b.vocal, b.energy];
    const w  = [1.2, 1.0, 1.0, 1.3, 1.1];
    let d = 0, na = 0, nb = 0;
    for (let i = 0; i < 5; i++) { d += av[i]*bv[i]*w[i]; na += av[i]*av[i]*w[i]; nb += bv[i]*bv[i]*w[i]; }
    // Tempo influence as a multiplicative factor (soft match)
    const tempoDiff = Math.abs((a.tempo || 90) - (b.tempo || 90)) / 180;
    const tempoFactor = Math.max(0.3, 1 - tempoDiff);
    if (na <= 1e-6 || nb <= 1e-6) return 0;
    return (d / Math.sqrt(na * nb)) * tempoFactor;
  };

  return {
    capture(f, pose) {
      // Gate 1: require real audio signal (not silence, not default stubs)
      const r = richness(f);
      if (r < 0.08) return false; // silent — useless to learn from
      // Gate 2: dedupe — don't capture a moment that is nearly identical to the
      // last capture (prevents 500 copies of the same pose when a song has a
      // steady section).
      if (snaps.length > 0) {
        const lastSnap = snaps[snaps.length - 1];
        if (sim(f, lastSnap) > 0.985) return false;
      }
      snaps.push({ ...f, pose, timestamp: Date.now() });
      if (snaps.length > MAX) snaps.shift();
      if (++dirty >= 10) { persist(); dirty = 0; }
      if (snaps.length % 25 === 0) console.log('[dance-memory] Captured snapshot', snaps.length, 'richness=' + r.toFixed(3));
      return true;
    },
    recall(f) {
      if (snaps.length < 5) return null;
      if (richness(f) < 0.08) return null; // don't recall during silence
      const scored = snaps.map(s => ({ s, v: sim(f, s) })).sort((a, b) => b.v - a.v).slice(0, 3);
      const tot = scored.reduce((a, x) => a + Math.max(0, x.v), 0);
      if (tot <= 0) return null;
      // Diversity check: if the top match is also the oldest thing we recalled,
      // bump it down and use the 2nd best. Keeps the dance evolving.
      const pose = {};
      for (const k of BK) pose[k] = 0;
      for (const { s, v } of scored) { const w = Math.max(0, v) / tot; for (const k of BK) pose[k] += (s.pose[k] || 0) * w; }
      // Confidence = top sim * corpus-saturation, but CAPPED below 1 if the
      // top sim is suspiciously perfect (dedup should prevent this now).
      const topSim = scored[0].v;
      const rawConf = Math.min(1, topSim) * Math.min(1, snaps.length / 50);
      last = { pose, confidence: topSim > 0.995 ? rawConf * 0.4 : rawConf };
      lastT = performance.now();
      // Only log when the similarity actually changed meaningfully
      if (Math.abs(topSim - lastLoggedSim) > 0.05) {
        console.log('[dance-memory] recall sim=' + topSim.toFixed(3) + ' conf=' + last.confidence.toFixed(3) + ' n=' + snaps.length);
        lastLoggedSim = topSim;
      }
      return last;
    },
    getLast: () => last, getLastT: () => lastT, count: () => snaps.length,
    richness,
    clear: () => { snaps = []; last = null; persist(); console.log('[dance-memory] Cleared'); },
    exportAll: () => JSON.stringify(snaps),
  };
})();

// ── Arm Gesture State Machine — POINT, REACH, BECKON, HAND_TO_HEART ──
// She doesn't just cycle — she reaches, points, beckons, holds her hand to her heart.
// Gestures blend on top of cyclic arm motion, triggered by music and timer.
const Gestures = (() => {
  const TYPES = ['POINT', 'REACH', 'BECKON', 'HAND_TO_HEART'];
  let type = null, hand = 'right', t = 0, dur = 0, cooldown = 2.0, lastType = null;
  const pick = (a) => {
    // HAND_TO_HEART on quiet MUSIC (low energy, low vocal, but music is on)
    if (a._active && a.overall < 0.22 && a.vocal < 0.18) return 'HAND_TO_HEART';
    // REACH on vocal peaks
    if (a.vocal > 0.55) return 'REACH';
    // otherwise pick one that isn't the same as last
    const pool = TYPES.filter(x => x !== lastType && x !== 'HAND_TO_HEART');
    return pool[Math.floor(Math.random() * pool.length)];
  };
  return {
    update(dt, a) {
      // Only run the gesture SM when something is playing. No music = no gestures.
      if (!a._active) {
        if (type) { t += dt; if (t >= dur) { lastType = type; type = null; t = 0; cooldown = 1.5; } }
        return;
      }
      if (type) {
        t += dt;
        if (t >= dur) { lastType = type; type = null; t = 0; cooldown = 1.2 + Math.random() * 1.5; }
      } else {
        cooldown -= dt;
        const forceReach = a.vocal > 0.6 && lastType !== 'REACH';
        const forceHeart = a.overall > 0.08 && a.overall < 0.2 && a.vocal < 0.15 && lastType !== 'HAND_TO_HEART';
        if (cooldown <= 0 || forceReach || forceHeart) {
          type = forceHeart ? 'HAND_TO_HEART' : (forceReach ? 'REACH' : pick(a));
          hand = Math.random() < 0.5 ? 'left' : 'right';
          t = 0;
          dur = type === 'HAND_TO_HEART' ? (3.0 + Math.random() * 2.0) :
                type === 'REACH' ? (2.0 + Math.random() * 1.5) :
                type === 'POINT' ? (1.6 + Math.random() * 1.0) :
                (2.0 + Math.random() * 1.2); // BECKON
          console.log('[gesture] ' + type + ' ' + hand + ' for ' + dur.toFixed(1) + 's');
          // Expose for GSHub market resolvers
          window._lastGestureType = type;
          window._lastGestureAt = performance.now() / 1000;
        }
      }
    },
    // Returns { active, type, hand, progress, phase } — phase 0→1 ease-in, hold, ease-out
    state() {
      if (!type) return { active: false };
      const p = t / dur;
      // tri-phase envelope: 20% in, 60% hold, 20% out
      const env = p < 0.2 ? (p / 0.2) : p > 0.8 ? (1 - (p - 0.8) / 0.2) : 1;
      const eased = env * env * (3 - 2 * env); // smoothstep
      return { active: true, type, hand, progress: p, blend: eased };
    }
  };
})();
